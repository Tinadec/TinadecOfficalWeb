<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tinadec 是一个开源 AI 编程与多智能体工作台：围绕 Agent 循环、子代理隔离、权限沙箱、上下文压缩与检查点回退打造，包含 TinadecOffice、TinadecCore、TinadecTools、TinadecGateway 与 TinaClass、TinadecBand。"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Tinadec · AI 编程与多智能体工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem('tinadec-theme') || 'system';
        var dark =
          saved === 'dark' ||
          (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
