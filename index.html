<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tinadec — 当微粒彼此感知，智能便凝结成群。致力于集群智能、协同画布与克制美学的开源智能体生态，涵盖 TinadecOffice、MIT 开源核心 TinadecCore、TinadecTools、TinadecGateway 与 TinaClass、TinadecBand。"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Tinadec · 群智涌现，协同共生</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem('tinadec-theme') || 'system';
        var dark =
          saved === 'dark' ||
          (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
